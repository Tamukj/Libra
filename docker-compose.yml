name: libra

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging
  pids_limit: 256

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://libra:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/libra
      LIBRA_ALLOW_DEMO: "${LIBRA_ALLOW_DEMO:-0}"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: libra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libra -d libra"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  edge:
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
