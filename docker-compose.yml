name: gaitai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging
  pids_limit: 256

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - edge

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://gaitai:${DB_PASSWORD:-gaitai_secret_pass}@db:5432/gaitai
      PYTHONUNBUFFERED: "1"
    volumes:
      - api-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gaitai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gaitai_secret_pass}
      POSTGRES_DB: gaitai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaitai -d gaitai"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  edge:
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  api-data:
  postgres-data:
