[project]
name = "libra"
version = "1.0.0"
description = "Libra: Clinical Biomechanics & Decision Support Platform for Cerebral Palsy Rehabilitation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code only; gait-cp-dataset is CC-BY-NC-SA-4.0)" }
authors = [{ name = "Solveathon Team" }]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "python-multipart>=0.0.6",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
