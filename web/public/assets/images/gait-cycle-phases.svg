<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="stanceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="swingGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Stance Phase Box (0-60%) -->
  <rect x="20" y="20" width="500" height="90" rx="8" fill="url(#stanceGrad)" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="35" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0d9488">ФАЗА ОПОРЫ (STANCE PHASE) · 0% — 60%</text>

  <!-- Swing Phase Box (60-100%) -->
  <rect x="535" y="20" width="345" height="90" rx="8" fill="url(#swingGrad)" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="550" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">ФАЗА ПЕРЕНОСА (SWING) · 60% — 100%</text>

  <!-- Milestones -->
  <!-- 0% Heel Strike -->
  <circle cx="50" cy="75" r="5" fill="#0d9488"/>
  <text x="50" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27241f" text-anchor="middle">Начальный контакт</text>
  <text x="50" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">0% (Heel Strike)</text>

  <!-- 15% Loading Response -->
  <circle cx="160" cy="75" r="5" fill="#0d9488"/>
  <text x="160" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27241f" text-anchor="middle">Амортизация</text>
  <text x="160" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">12% (Loading)</text>

  <!-- 30% Mid Stance -->
  <circle cx="280" cy="75" r="5" fill="#0d9488"/>
  <text x="280" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27241f" text-anchor="middle">Середина опоры</text>
  <text x="280" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">30% (Mid Stance)</text>

  <!-- 50% Terminal Stance / Max Hip Extension (KEY BIOMARKER aMinSagH) -->
  <circle cx="430" cy="75" r="7" fill="#b91c1c"/>
  <text x="430" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Макс. разгибание (aMinSagH)</text>
  <text x="430" y="112" font-family="monospace" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">~50% (Terminal Stance)</text>

  <!-- 60% Toe Off -->
  <circle cx="535" cy="75" r="6" fill="#b45309"/>
  <text x="535" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Отрыв пальцев</text>
  <text x="535" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">60% (Toe-Off)</text>

  <!-- 75% Mid Swing -->
  <circle cx="680" cy="75" r="5" fill="#b45309"/>
  <text x="680" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27241f" text-anchor="middle">Середина переноса</text>
  <text x="680" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">75% (Mid Swing)</text>

  <!-- 100% Terminal Swing -->
  <circle cx="840" cy="75" r="5" fill="#0d9488"/>
  <text x="840" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27241f" text-anchor="middle">Завершение шага</text>
  <text x="840" y="112" font-family="monospace" font-size="10" fill="#655f55" text-anchor="middle">100% (Terminal)</text>

  <!-- Connection Line -->
  <path d="M 50 75 L 840 75" stroke="#d8d0c2" stroke-width="2" z-index="-1"/>
</svg>