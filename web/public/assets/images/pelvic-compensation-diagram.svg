<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="100%" height="100%" fill="none">
  <rect width="740" height="370" rx="10" fill="#fffefa" stroke="#d8d0c2" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1c1917">
    Биомеханический конфликт: Истинное разгибание (TJE) vs Наклон таза (PCR)
  </text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#655f55">
    Дифференциация анатомического движения бедра от компенсаторного поясничного гиперлордоза
  </text>

  <!-- Panel 1: Normal True Joint Extension -->
  <g transform="translate(32, 78)">
    <rect width="320" height="260" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
    
    <!-- Status indicator badge -->
    <circle cx="26" cy="28" r="5" fill="#0d9488" />
    <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d9488">
      Истинное разгибание (TJE ≤ -1°)
    </text>
    
    <!-- Schematic Diagram (shifted to right side of panel to leave left side clear for labels) -->
    <g transform="translate(195, 45)">
      <!-- Spine (vertical, stable) -->
      <line x1="20" y1="10" x2="20" y2="60" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#655f55">Позвоночник</text>
      
      <!-- Pelvis horizontal oval -->
      <ellipse cx="20" cy="70" rx="34" ry="12" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="2"/>
      <text x="58" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#0d9488" font-weight="600">Таз (0°)</text>

      <!-- Hip leg extending backward -->
      <line x1="20" y1="70" x2="-14" y2="135" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
      <text x="-48" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#0d9488" font-weight="600">Бедро</text>
    </g>

    <!-- Clear Clinical Findings on left/bottom with generous spacing -->
    <g transform="translate(20, 150)">
      <rect width="280" height="88" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#1c1917">
        Положение таза: стабильно (ΔSagP ≈ 0°)
      </text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0d9488">
        Физиологическая работа мышц бедра
      </text>
      <text x="14" y="66" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0d9488">
        PCR &lt; 0.40 · Безопасный прогресс в VR
      </text>
    </g>
  </g>

  <!-- Panel 2: Pathological Compensation (Anterior Pelvic Tilt) -->
  <g transform="translate(388, 78)">
    <rect width="320" height="260" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    
    <!-- Status indicator badge -->
    <circle cx="26" cy="28" r="5" fill="#b91c1c" />
    <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">
      Компенсация в VR (PCR &gt; 0.80)
    </text>
    
    <!-- Schematic Diagram (shifted to right side of panel) -->
    <g transform="translate(195, 45)">
      <!-- Spine (Curved lordosis) -->
      <path d="M 20 10 Q 38 35 20 60" stroke="#b91c1c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <text x="34" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#b91c1c" font-weight="600">Гиперлордоз</text>

      <!-- Tilted Pelvis oval -->
      <g transform="rotate(22 20 68)">
        <ellipse cx="20" cy="68" rx="34" ry="12" fill="#b91c1c" fill-opacity="0.18" stroke="#b91c1c" stroke-width="2"/>
      </g>
      <text x="58" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#b91c1c" font-weight="700">+5.5° наклон</text>

      <!-- Apparent leg extension -->
      <line x1="20" y1="68" x2="-8" y2="135" stroke="#b91c1c" stroke-width="4.5" stroke-linecap="round"/>
      <text x="-48" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#655f55">Ложный шаг</text>
    </g>

    <!-- Clear Clinical Findings on left/bottom with generous spacing -->
    <g transform="translate(20, 150)">
      <rect width="280" height="88" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">
        Передний наклон таза (+5.5° ΔSagP)
      </text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#655f55">
        Перегрузка поясничного отдела позвоночника
      </text>
      <text x="14" y="66" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#b91c1c">
        PCR = 1.21 · Показана отмена VR (Verbal)
      </text>
    </g>
  </g>
</svg>
